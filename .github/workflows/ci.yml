name: CI/CD — Testes e Deploy

on:
  push:
    branches: [main, dev, "feature/*", "devops/*"]
  pull_request:
    branches: [main]

jobs:
  # ─── TESTES AUTOMÁTICOS ───────────────────────────────────────────
  test:
    name: Testes Automáticos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache de dependências pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar testes com cobertura
        run: |
          python -m pytest tests/ -v --tb=short --cov=backend --cov-report=term-missing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TESTING: "true"
          GROQ_API_KEY: "fake-key-for-tests"
          SECRET_KEY: "secret-test-key"

  # ─── DEPLOY NO RENDER (apenas na main após testes passarem) ───────
  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Trigger deploy no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK não configurado. Pulando deploy."
            exit 0
          fi
          echo "🚀 Disparando deploy no Render..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST "$RENDER_DEPLOY_HOOK")
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "✅ Deploy disparado com sucesso! (HTTP $response)"
          else
            echo "❌ Falha ao disparar deploy. (HTTP $response)"
            exit 1
          fi

      - name: Aguardar deploy e verificar saúde
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "⚠️  RENDER_SERVICE_URL não configurado. Pulando verificação."
            exit 0
          fi
          echo "⏳ Aguardando 60s para o Render reiniciar..."
          sleep 60
          echo "🔍 Verificando se a aplicação está respondendo..."
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_SERVICE_URL/" || echo "000")
            if [ "$status" -eq 200 ]; then
              echo "✅ Aplicação online! (HTTP $status)"
              exit 0
            fi
            echo "Tentativa $i/3 — HTTP $status. Aguardando 20s..."
            sleep 20
          done
          echo "⚠️  Aplicação pode ainda estar iniciando. Verifique o dashboard do Render."
